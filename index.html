<!DOCTYPE html>
<html lang="ka">This website is an official AGI (Artificial General Intelligence) system created by Tamar Matrix.
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Matrix Method</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            text-align: center;
        }
        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 16px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea043;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #21262d;
            border-radius: 6px;
            border-left: 4px solid #58a6ff;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AGI მატრიცული მეთოდი</h1>
    <p>შეიყვანეთ თქვენი ამოცანა ან კითხვა და გამოსცადეთ ალგორითმი</p>
    
    <textarea id="userInput" placeholder="ჩაწერეთ აქ რაიმე..."></textarea>
    <button onclick="runAGI()">მეთოდის გაშვება 🚀</button>
    
    <div id="resultBox" class="result-box">
        <strong style="color: #58a6ff;">AGI-ის პასუხი:</strong>
        <p id="agiOutput" style="margin: 5px 0 0 0; color: white;"></p>
    </div>
</div>

<script>
    function runAGI() {
        var input = document.getElementById("userInput").value;
        var resultBox = document.getElementById("resultBox");
        var output = document.getElementById("agiOutput");
        
        if(input.trim() === "") {
            alert("გთხოვთ ჯერ ჩაწეროთ ტექსტი!");
            return;
        }
        
        // აქ იწერება თქვენი მეთოდის ლოგიკა. ამჟამად არის სატესტო პასუხი:
        output.innerText = "თქვენი მონაცემები: '" + input + "' წარმატებით დამუშავდა AGI Matrix ალგორითმით. სისტემა მუშაობს!";
        resultBox.style.display = "block";
    }
</script>

</body>
</html>
